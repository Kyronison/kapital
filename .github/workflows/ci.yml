name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build:web
      - name: Проверка баланса
        run: pnpm sim:check
      - name: Проверка баланса быстрого режима
        run: pnpm sim --mode quick --games 400 --check
      - name: Шанс отыграться в партии на четверых
        run: pnpm sim:table --games 400 --check && pnpm sim:table --mode quick --games 400 --check
      - name: Проверка сложности уровней «Тренировки»
        run: pnpm sim:levels --games 300 --check
