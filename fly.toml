# Запуск на Fly.io: flyctl launch --copy-config --no-deploy, затем flyctl volumes create kapital_data и flyctl deploy.
app = "kapital"
primary_region = "ams"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"
  KAPITAL_DATA_DIR = "/data"

[[mounts]]
  source = "kapital_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  # партии живут в памяти одного процесса, поэтому машина одна и не засыпает
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
